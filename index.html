<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1E2A4A">
  <meta name="description" content="Suivi de mes comptes, budget et simulations. Données gardées sur le téléphone et sauvegardées dans Google Drive.">
  <title>Mes finances</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icone-192.png">
  <link rel="apple-touch-icon" href="icone-192.png">
  <style>/* Mes finances : styles */
:root {
  --fond: #F4F5F8; --surface: #FFFFFF; --surface-2: #F1F3F7; --bord: #E3E6ED;
  --texte: #111827; --texte-2: #4B5563; --texte-3: #6B7280;
  --bleu: #2547D0; --bleu-fonce: #1A3499; --bleu-clair: #A9B8F0; --bleu-doux: #E8EDFD;
  --vert: #15803D; --vert-clair: #86D3A3; --orange: #E2643C; --orange-clair: #F5B9A2; --orange-fonce: #B5461F;
  --corail-doux: #FDEDE6; --rouge: #C62828;
  --sombre: #1E2A4A; --sombre-2: #2B3A63;
  --rayon: 16px; --ombre: 0 1px 2px rgba(17, 24, 39, .06), 0 2px 8px rgba(17, 24, 39, .04);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="clair"]) {
    --fond: #0F1320; --surface: #1A2033; --surface-2: #232A40; --bord: #2E3650;
    --texte: #F3F4F6; --texte-2: #C3C8D4; --texte-3: #9AA3B5;
    --bleu: #7D97FF; --bleu-fonce: #A9B8FF; --bleu-clair: #3B4C8F; --bleu-doux: #253056;
    --vert: #4ADE80; --vert-clair: #1F6B3E; --orange: #FF8A5C; --orange-clair: #7A3D27; --orange-fonce: #FFA27F;
    --corail-doux: #3A2620; --sombre: #263259; --sombre-2: #33437A; --ombre: none;
    color-scheme: dark;
  }
}
:root[data-theme="sombre"] {
  --fond: #0F1320; --surface: #1A2033; --surface-2: #232A40; --bord: #2E3650;
  --texte: #F3F4F6; --texte-2: #C3C8D4; --texte-3: #9AA3B5;
  --bleu: #7D97FF; --bleu-fonce: #A9B8FF; --bleu-clair: #3B4C8F; --bleu-doux: #253056;
  --vert: #4ADE80; --vert-clair: #1F6B3E; --orange: #FF8A5C; --orange-clair: #7A3D27; --orange-fonce: #FFA27F;
  --corail-doux: #3A2620; --sombre: #263259; --sombre-2: #33437A; --ombre: none;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--fond); color: var(--texte); font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; overscroll-behavior: none; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
button:disabled { opacity: .45; cursor: default; }
a { color: inherit; text-decoration: none; }
:focus-visible { outline: 3px solid var(--bleu); outline-offset: 2px; border-radius: 8px; }
h1, h2, h3, p { margin: 0; }
h2 { font-size: 18px; }
small { font-size: 12px; }
.invisible { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

#app { height: 100%; display: flex; flex-direction: column; max-width: 560px; margin: 0 auto; position: relative; }
.contenu { flex: 1; overflow-y: auto; padding: calc(env(safe-area-inset-top) + 12px) 16px 96px; }
.contenu.sans-nav { padding-bottom: 110px; }
.page { display: flex; flex-direction: column; gap: 12px; }

/* Barre du bas */
.barre { position: absolute; left: 0; right: 0; bottom: 0; display: grid; grid-template-columns: repeat(5, 1fr); background: var(--surface); border-top: 1px solid var(--bord); padding: 6px 4px calc(env(safe-area-inset-bottom) + 6px); z-index: 5; }
.barre a { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11.5px; color: var(--texte-3); font-weight: 500; min-height: 48px; justify-content: center; }
.barre .bulle { width: 52px; height: 30px; border-radius: 15px; display: grid; place-items: center; }
.barre a.actif { color: var(--bleu); font-weight: 700; }
.barre a.actif .bulle { background: var(--bleu-doux); }

/* Titres */
.entete { display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; min-height: 48px; }
.entete h1 { text-align: center; font-size: 19px; }
.btn-icone { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 12px; color: var(--texte-2); }
.btn-icone.petit { width: 36px; height: 36px; }
.ligne-titre { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.ligne-titre.petit { font-size: 13.5px; color: var(--texte-2); flex-wrap: wrap; }
.titre-page { font-size: 26px; }
.titre-bloc { font-size: 16px; margin-top: 8px; color: var(--texte-2); }
.titre-bloc small { font-weight: 500; font-size: 13px; }
.discret { color: var(--texte-3); font-size: 14px; }
.lien { color: var(--bleu); font-weight: 600; font-size: 14px; padding: 8px 0; text-align: left; }
.aide { font-size: 13px; color: var(--texte-3); line-height: 1.45; }
.aide.bleue { color: var(--bleu); }
.aide.bloc { display: flex; flex-direction: column; gap: 6px; padding: 10px 0 2px; }
.centre { text-align: center; justify-self: center; align-self: center; }
.etiquette { font-size: 13px; font-weight: 600; color: var(--texte-2); margin-top: 4px; }

/* Cartes */
.carte { background: var(--surface); border-radius: var(--rayon); box-shadow: var(--ombre); padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.carte.liste { padding: 4px 0; gap: 0; }
.carte.douce { background: var(--surface-2); box-shadow: none; }
.carte.vide, p.vide { color: var(--texte-3); text-align: center; padding: 18px 14px; font-size: 14px; }
.carte.vide { align-items: center; }
.carte.feuille { border: 1px solid var(--bord); }
.carte.pointilles { border: 1.5px dashed var(--bord); box-shadow: none; }
.bord-bleu { border: 2px solid var(--bleu); }
.carte-sombre { background: linear-gradient(145deg, var(--sombre), var(--sombre-2)); color: #fff; border-radius: 22px; padding: 18px; display: flex; flex-direction: column; gap: 6px; }
.discret-clair { color: rgba(255, 255, 255, .75); font-size: 14px; }
.gros-montant { font-size: 32px; font-weight: 800; letter-spacing: -.5px; font-variant-numeric: tabular-nums; }
.sur-titre { font-size: 12.5px; text-transform: uppercase; letter-spacing: .5px; color: rgba(255, 255, 255, .7); margin-top: 6px; }
.grille-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.grille-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.tuile-sombre { background: rgba(255, 255, 255, .1); border-radius: 12px; padding: 10px; display: flex; flex-direction: column; font-size: 13px; color: rgba(255, 255, 255, .8); }
.tuile-sombre b { font-size: 18px; color: #fff; }
.tuile { border-radius: 12px; padding: 10px; display: flex; flex-direction: column; gap: 2px; font-size: 12.5px; min-width: 0; }
.tuile span { display: flex; align-items: center; gap: 4px; font-weight: 600; }
.tuile b { font-size: 15px; letter-spacing: -.3px; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tuile small { color: var(--texte-3); font-size: 11.5px; }
.tuile.corail { background: var(--corail-doux); color: var(--orange-fonce); }
.tuile.bleue { background: var(--bleu-doux); color: var(--bleu); }
.tuile.grise { background: var(--surface-2); color: var(--texte-2); }
.tuile.corail b, .tuile.bleue b, .tuile.grise b { color: var(--texte); }
.puce-etat { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; background: var(--surface); padding: 6px 10px; border-radius: 20px; box-shadow: var(--ombre); color: var(--texte-2); }

/* Lignes */
.ligne { display: flex; align-items: center; gap: 12px; padding: 10px 14px; min-height: 56px; width: 100%; text-align: left; }
.ligne + .ligne, .op + .op { border-top: 1px solid var(--bord); }
label.ligne { flex-direction: row; }
.ligne.colonne { flex-direction: column; align-items: stretch; gap: 8px; }
.ligne.choisie { background: var(--bleu-doux); }
.ligne-texte { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.ligne-texte b { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ligne-texte span { font-size: 13px; color: var(--texte-3); }
.montant { font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
.negatif { color: var(--orange-fonce); }
.positif { color: var(--bleu); }
.groupe { display: flex; flex-direction: column; gap: 6px; }
.groupe-titre { display: flex; justify-content: space-between; align-items: center; font-size: 13.5px; font-weight: 600; color: var(--texte-2); padding: 4px 4px 0; }
.titre-editable { border: 0; background: transparent; font-weight: 700; color: var(--texte-2); padding: 6px 4px; flex: 1; border-bottom: 1px dashed var(--bord); }
.boutons-mini { display: flex; }
.pastille { display: inline-grid; place-items: center; border-radius: 50%; flex: none; }
.pastille.contour { width: 34px; height: 34px; border: 1.5px dashed; background: transparent; }
.pastille.grande { width: 64px; height: 64px; }
.pastille-btn { border-radius: 50%; flex: none; }

/* Opérations */
.choix-compte { display: flex; align-items: center; gap: 10px; font-size: 20px; padding: 4px 0; }
.nav-mois { display: grid; grid-template-columns: 48px 1fr 48px; align-items: center; gap: 8px; }
.mois-centre { text-align: center; display: flex; flex-direction: column; }
.mois-centre strong { font-size: 18px; }
.mois-centre span { font-size: 12.5px; color: var(--texte-3); }
.btn-carre { width: 44px; height: 44px; border-radius: 12px; background: var(--surface); box-shadow: var(--ombre); display: grid; place-items: center; font-size: 22px; font-weight: 600; flex: none; }
.btn-carre.bleu { background: var(--bleu); color: #fff; }
.recherche { flex-direction: row; font-weight: 400; display: flex; align-items: center; gap: 8px; background: var(--surface); border-radius: 14px; padding: 0 6px 0 14px; box-shadow: var(--ombre); color: var(--texte-3); }
.recherche input[type=text] { flex: 1; border: 0; background: transparent; padding: 13px 0; min-width: 0; color: var(--texte); outline: none; }
.puces { display: flex; flex-wrap: wrap; gap: 8px; }
.puce { border: 1.5px solid var(--bord); background: var(--surface); padding: 8px 14px; border-radius: 20px; font-size: 14px; font-weight: 500; min-height: 40px; }
.puce.active { background: var(--bleu); color: #fff; border-color: var(--bleu); }
.puce small { opacity: .7; }
.resume-filtre { font-size: 13.5px; color: var(--texte-2); }
.jour { display: flex; flex-direction: column; gap: 6px; }
.jour-titre { display: flex; justify-content: space-between; font-size: 13px; font-weight: 600; color: var(--texte-3); padding: 4px 4px 0; }
.op-ligne { display: flex; align-items: center; gap: 8px; padding: 8px 8px; min-height: 58px; }
.op-ligne.plein { width: 100%; text-align: left; gap: 12px; padding: 10px 14px; }
.op-texte { flex: 1; min-width: 0; display: flex; flex-direction: column; text-align: left; padding: 4px 0; }
.op-texte b { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.op-texte span { font-size: 12.5px; color: var(--texte-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.op .montant.neutre { color: var(--texte-2); }
.op .montant.prevu { color: var(--texte-3); font-style: italic; }
.op.prevue { background: repeating-linear-gradient(135deg, transparent 0 10px, var(--surface-2) 10px 11px); }
.op.ouverte { background: var(--surface-2); }
.op.inactive .op-texte b, .op.inactive .op-texte { opacity: .55; }
.op.sous .op-ligne { padding-left: 34px; }
.coche { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; border: 1.5px solid var(--bord); color: var(--texte-3); flex: none; }
.coche.pointille { border-style: dashed; }
.coche.cochon.on { background: var(--corail-doux); border-color: var(--orange); color: var(--orange-fonce); }
.coche.calc.on { background: var(--bleu-doux); border-color: var(--bleu); color: var(--bleu); }
.op-edition { display: flex; flex-direction: column; gap: 10px; padding: 4px 14px 14px; }
.boutons { display: flex; flex-wrap: wrap; gap: 8px; }
.boutons.pad { padding: 4px 14px 14px; }

/* Formulaires */
label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 600; color: var(--texte-2); }
input[type=text], input[type=number], input[type=date], input[type=month], input[type=password], input[type=search], select, textarea {
  border: 1.5px solid var(--bord); background: var(--surface); border-radius: 12px; padding: 11px 12px; font-size: 16px; font-weight: 500; color: var(--texte); min-height: 46px; width: 100%; min-width: 0;
}
textarea { resize: vertical; font-family: ui-monospace, monospace; font-size: 14px; }
input:focus, select:focus, textarea:focus { border-color: var(--bleu); outline: none; }
.droite { text-align: right; font-variant-numeric: tabular-nums; }
input.court { width: 96px; flex: none; }
.ligne-champ { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-direction: row; font-size: 15px; font-weight: 500; color: var(--texte); min-height: 48px; }
.ligne-champ input { width: auto; flex: 1; max-width: 60%; }
.ligne-champ input.court { max-width: 96px; }
.carte.champs { gap: 0; padding: 4px 14px; }
.carte.champs .ligne-champ + .ligne-champ { border-top: 1px solid var(--bord); }
.formulaire { gap: 12px; }
.grille-ajout { display: grid; grid-template-columns: 1fr 110px 44px; gap: 8px; align-items: center; }
.btn-principal, .btn-secondaire, .btn-danger, .btn-clair { min-height: 46px; padding: 10px 18px; border-radius: 14px; font-weight: 700; font-size: 15px; display: inline-flex; align-items: center; justify-content: center; text-align: center; }
.btn-principal { background: var(--bleu); color: #fff; }
.btn-secondaire { background: var(--bleu-doux); color: var(--bleu); }
.btn-danger { background: transparent; color: var(--rouge); border: 1.5px solid currentColor; }
.btn-clair { background: #fff; color: var(--sombre); margin-top: 8px; }
.petit.btn-principal, .petit.btn-secondaire, .petit.btn-danger { min-height: 40px; padding: 8px 14px; font-size: 14px; }
.btn-principal.large { width: 100%; }
.pied-fixe { position: absolute; left: 0; right: 0; bottom: 0; padding: 12px 16px calc(env(safe-area-inset-bottom) + 12px); background: var(--fond); border-top: 1px solid var(--bord); }
.segments { display: grid; background: var(--surface-2); border-radius: 12px; padding: 4px; gap: 4px; }
.segments button { min-height: 40px; border-radius: 9px; font-weight: 600; font-size: 14px; color: var(--texte-2); }
.segments button.actif { background: var(--surface); color: var(--bleu); box-shadow: var(--ombre); }
.interrupteur { width: 52px; height: 32px; border-radius: 16px; background: #C4C9D2; position: relative; flex: none; transition: background .15s; }
.interrupteur span { position: absolute; top: 3px; left: 3px; width: 26px; height: 26px; border-radius: 50%; background: #fff; transition: transform .15s; box-shadow: 0 1px 3px rgba(0, 0, 0, .25); }
.interrupteur.on { background: var(--bleu); }
.interrupteur.on span { transform: translateX(20px); }
.plieur { display: flex; align-items: center; justify-content: space-between; font-weight: 600; font-size: 14.5px; color: var(--texte-2); min-height: 40px; width: 100%; }
.plieur[aria-expanded="true"] svg { transform: rotate(180deg); }

/* Saisie */
.montant-saisie { align-items: center; padding: 8px 0; }
.ligne-montant { display: flex; align-items: baseline; justify-content: center; font-size: 38px; font-weight: 800; color: var(--texte); }
.ligne-montant input { border: 0; background: transparent; font-size: 38px; font-weight: 800; width: 6.5ch; text-align: center; padding: 0; min-height: 0; color: inherit; }
.ligne-montant.positif { color: var(--bleu); }
.champ-relatif { position: relative; display: flex; flex-direction: column; gap: 6px; }
.suggestions { background: var(--surface); border: 1px solid var(--bord); border-radius: 14px; box-shadow: 0 8px 24px rgba(17, 24, 39, .12); overflow: hidden; }
.grille-cats { display: grid; grid-template-columns: repeat(auto-fill, minmax(74px, 1fr)); gap: 6px; }
.tuile-cat { border: 1.5px solid var(--bord); background: var(--surface); border-radius: 12px; padding: 6px 2px 5px; display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11.5px; font-weight: 600; min-height: 60px; text-align: center; line-height: 1.15; }
.tuile-cat.active span:last-child { color: inherit; }
.recherche.petite input[type=text] { padding: 9px 0; font-size: 15px; }
.tuile-cat.sous { border-style: dashed; }
.tuile-cat span:last-child { overflow: hidden; text-overflow: ellipsis; max-width: 100%; }

/* Budget */
.frise { position: relative; display: grid; grid-template-columns: repeat(13, 1fr); gap: 4px; align-items: end; height: 150px; padding-top: 10px; }
.frise-ref { position: absolute; left: 0; right: 0; border-top: 2px dashed var(--texte-3); pointer-events: none; }
.frise-ref span { position: absolute; right: 0; top: -20px; font-size: 11px; color: var(--texte-3); background: var(--surface); padding: 0 4px; }
.frise-col { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 4px; height: 100%; min-height: 44px; }
.frise-barre { width: 100%; max-width: 22px; border-radius: 5px 5px 2px 2px; }
.frise-col.sel .frise-barre { outline: 2px solid var(--texte); outline-offset: 1px; }
.frise-l { font-size: 11.5px; color: var(--texte-3); }
.frise-col.sel .frise-l { color: var(--texte); font-weight: 800; }
.legende { display: flex; flex-wrap: wrap; gap: 10px; font-size: 12px; color: var(--texte-3); }
.legende i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 4px; vertical-align: -1px; }
.budget-ligne { padding: 12px 14px; gap: 8px; }
.budget-tete { display: flex; align-items: center; gap: 12px; text-align: left; width: 100%; }
.budget-tete .alerte { color: var(--orange-fonce); }
.budget-chiffres { display: flex; flex-direction: column; align-items: flex-end; font-variant-numeric: tabular-nums; }
.budget-chiffres small { color: var(--texte-3); }
.jauge { height: 8px; background: var(--surface-2); border-radius: 4px; overflow: hidden; }
.jauge span { display: block; height: 100%; border-radius: 4px; }
.budget-detail { display: flex; flex-direction: column; gap: 10px; border-top: 1px solid var(--bord); padding-top: 10px; }
.mini-frise { position: relative; display: grid; grid-template-columns: repeat(13, 1fr); gap: 3px; align-items: end; height: 84px; }
.mini-ligne { position: absolute; left: 0; right: 0; border-top: 2px dashed var(--texte-3); }
.mini-col { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 2px; height: 100%; }
.mini-col span { width: 100%; max-width: 16px; border-radius: 3px; }
.mini-col small { font-size: 10px; color: var(--texte-3); }
.limite { display: flex; flex-direction: column; gap: 6px; }
.limite-ligne { display: grid; grid-template-columns: 44px 1fr 44px; gap: 8px; }
.liste-simple { display: flex; flex-direction: column; }
.ls-ligne { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid var(--bord); font-variant-numeric: tabular-nums; width: 100%; text-align: left; }
.ls-ligne > span:first-child { display: flex; flex-direction: column; min-width: 0; }
.ls-ligne b { font-weight: 600; font-size: 14.5px; }
.ls-ligne small { color: var(--texte-3); }
.ls-ligne.exclue b, .ls-ligne.exclue > span:last-child { text-decoration: line-through; opacity: .6; }

/* Simulation */
.ecran-calc { background: var(--surface-2); border-radius: 12px; padding: 10px 14px; display: flex; flex-direction: column; align-items: flex-end; }
.ecran-calc span { color: var(--texte-3); font-size: 15px; min-height: 20px; word-break: break-all; }
.ecran-calc b { font-size: 26px; font-variant-numeric: tabular-nums; }
.clavier { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.clavier button { min-height: 48px; border-radius: 12px; background: var(--surface-2); font-size: 19px; font-weight: 600; }
.clavier button.op { background: var(--bleu-doux); color: var(--bleu); }
.clavier button.egal { background: var(--bleu); color: #fff; }
.reste { text-align: center; align-items: stretch; }
.reste.ok { border: 2px solid var(--vert); }
.reste.ko { border: 2px solid var(--orange); }
.reste.ok p { color: var(--vert); font-weight: 600; }
.reste.ko p { color: var(--orange-fonce); font-weight: 600; }
.titre-reste { border: 0 !important; background: transparent !important; text-align: center; font-weight: 700 !important; color: var(--texte-2) !important; min-height: 36px !important; padding: 4px !important; }
.simu-ligne { display: grid; grid-template-columns: 36px 1fr 96px 36px; gap: 8px; align-items: center; padding: 8px 10px; }
.simu-ligne + .simu-ligne { border-top: 1px solid var(--bord); }
.simu-texte { display: flex; flex-direction: column; min-width: 0; }
.simu-lib { border: 0 !important; background: transparent !important; padding: 4px 0 !important; min-height: 32px !important; font-weight: 600 !important; }
.simu-regle { font-size: 13px !important; min-height: 34px !important; padding: 6px 8px !important; margin-top: 4px; }
.simu-montant { text-align: right; padding: 8px !important; min-height: 40px !important; font-variant-numeric: tabular-nums; }
.simu-montant.positif { color: var(--bleu) !important; }
.reel { font-size: 12.5px; font-weight: 600; text-align: left; padding: 2px 0; }
.simu-cats { grid-column: 1 / -1; }

/* Catégories */
.palette { display: flex; flex-wrap: wrap; gap: 8px; }
.couleur { width: 40px; height: 40px; border-radius: 50%; border: 3px solid; display: grid; place-items: center; }
.couleur span { width: 16px; height: 16px; border-radius: 50%; }
.grille-icones { display: grid; grid-template-columns: repeat(auto-fill, minmax(48px, 1fr)); gap: 6px; }
.icone-choix { height: 48px; border-radius: 12px; border: 1.5px solid var(--bord); display: grid; place-items: center; color: var(--texte-2); }

/* Bouton flottant, bandeau, toast */
.fab { position: absolute; right: 18px; bottom: calc(env(safe-area-inset-bottom) + 84px); width: 58px; height: 58px; border-radius: 18px; background: var(--bleu); color: #fff; display: grid; place-items: center; box-shadow: 0 6px 16px rgba(37, 71, 208, .35); z-index: 4; }
.bandeau { display: flex; align-items: center; gap: 10px; width: 100%; background: var(--bleu-doux); color: var(--bleu-fonce); border-radius: 14px; padding: 12px 14px; text-align: left; font-size: 14px; font-weight: 600; margin-bottom: 12px; }
.toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 92px); transform: translate(-50%, 20px); background: #111827; color: #fff; padding: 12px 18px; border-radius: 14px; font-size: 14.5px; opacity: 0; pointer-events: none; transition: all .2s; max-width: calc(100% - 32px); z-index: 20; text-align: center; }
.toast.visible { opacity: 1; transform: translate(-50%, 0); }
.bienvenue { gap: 8px; }
.bienvenue p { font-size: 14.5px; color: rgba(255, 255, 255, .9); }

/* Verrou */
.verrou { height: 100%; display: grid; place-items: center; padding: 24px; }
.verrou-boite { display: flex; flex-direction: column; align-items: center; gap: 12px; width: 100%; max-width: 320px; }
.verrou-boite p { color: var(--texte-3); }
.points { display: flex; gap: 16px; margin: 10px 0 18px; }
.point { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--texte-3); }
.point.plein { background: var(--bleu); border-color: var(--bleu); }
.clavier-code { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; width: 100%; }
.touche-code { height: 68px; border-radius: 50%; background: var(--surface); box-shadow: var(--ombre); font-size: 26px; font-weight: 600; }

.groupe-titre input.titre-editable { border: 0; border-bottom: 1px dashed var(--bord); border-radius: 0; background: transparent; min-height: 36px; padding: 4px; font-size: 14px; font-weight: 700; color: var(--texte-2); }
.budget-ligne.sous { margin-left: 22px; padding: 9px 12px; box-shadow: none; border: 1px dashed var(--bord); }
.budget-ligne.sous .budget-tete b { font-size: 14.5px; }
.carte.replie { flex-direction: row; align-items: center; gap: 12px; text-align: left; width: 100%; border: 1.5px dashed var(--bord); box-shadow: none; background: var(--surface-2); }
.grille-3 .tuile b { font-size: 14px; letter-spacing: -.4px; text-overflow: clip; }
</style>
</head>
